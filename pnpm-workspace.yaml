allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# Security: patched versions of vulnerable transitive deps (same major only).
overrides:
  hono: ^4.13.11
  '@hono/node-server': ^1.19.10
  postcss: ^8.5.18
  'nanoid@<4': ^3.3.18
  browserslist: ^4.28.7
  defu: ^6.1.5
  lodash: ^4.18.0
  effect: ^3.20.0
  mysql2: ^3.22.0
